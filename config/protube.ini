; KHARVOX - ProTubeVR ProVolver / ForceTube recoil
;
; Recoil turns on automatically when ForceTubeVR_API_x64.dll is placed in the
; KHARVOX folder next to KharvoxLayer.dll. Pair the ProVolver in Windows
; Bluetooth settings first. Close the ProTubeVR Companion app before playing so
; it does not hold the Bluetooth connection. Log: %TEMP%\KHARVOX-PROTUBE.log
;
; DOOM does not report individual shots, so kicks are timed from the trigger.
; If kicks drift from what you see, adjust interval_ms for that weapon.

[general]
enabled=1
; 0 = all devices (recommended for a single ProVolver), 4 = pistol1, 2 = rifleButt
channel=0
; Scales every kick and rumble (0-200)
power_percent=100
; pistol = ProVolver first, rifle = ForceTube stock first
init=pistol

; mode:        none | repeat | charge | continuous
; kick:        solenoid power 0-255 (auto-capped for fast fire rates)
; rumble:      motor power 0-255
; rumble_ms:   rumble per shot, 25-500
; interval_ms: time between shots while the trigger is held
; ramp_ms:     spin-up time (fire rate starts at half speed)
; charge_ms:   delay from trigger to the kick (BFG)

[pistol]
mode=repeat
kick=150
rumble=90
rumble_ms=40
interval_ms=330

[shotgun]
mode=repeat
kick=230
rumble=180
rumble_ms=70
interval_ms=900

[heavy_assault_rifle]
mode=repeat
kick=80
rumble=120
rumble_ms=40
interval_ms=100

[plasma_rifle]
mode=repeat
kick=40
rumble=140
rumble_ms=50
interval_ms=95

[rocket_launcher]
mode=repeat
kick=255
rumble=200
rumble_ms=90
interval_ms=900

[super_shotgun]
mode=repeat
kick=255
rumble=255
rumble_ms=100
interval_ms=1300

[gauss_cannon]
mode=repeat
kick=255
rumble=160
rumble_ms=80
interval_ms=1500

[chaingun]
mode=repeat
kick=40
rumble=160
rumble_ms=40
interval_ms=70
ramp_ms=600

[bfg]
mode=charge
kick=255
rumble=220
rumble_ms=120
charge_ms=750

[chainsaw]
mode=continuous
kick=0
rumble=200
rumble_ms=100
interval_ms=90

[fists]
mode=none
